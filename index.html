<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meal Prep Box Manager</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --card-border: #3f3f46;
      --accent: #3b82f6;
      --consumed-bg: #14532d;
      --consumed-border: #22c55e;
      --consumed-text: #86efac;
      --text: #ffffff;
      --text-muted: #a1a1aa;
      --danger: #991b1b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
    }

    h1 { font-size: 1.2rem; margin: 0; color: var(--text); }

    button {
      font-family: inherit;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:active { opacity: 0.8; }

    .btn-add { background-color: var(--accent); color: white; }
    .btn-settings { background-color: #27272a; color: white; border: 1px solid var(--card-border); }
    .btn-reset { background-color: var(--danger); color: white; font-size: 0.85rem; }

    .box-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .box-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.3s ease;
    }

    .box-card.consumed {
      background-color: var(--consumed-bg);
      border-color: var(--consumed-border);
    }

    .box-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .box-title { font-weight: bold; font-size: 1.05rem; }

    .box-status {
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      background: #27272a;
      color: var(--text-muted);
    }

    .consumed .box-status {
      background: #052e16;
      color: var(--consumed-text);
    }

    .box-items {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.9rem;
      color: #d4d4d8;
    }

    .consumed .box-items { color: #e4e4e7; }

    .btn-consume {
      background-color: #27272a;
      color: white;
      border: 1px solid var(--card-border);
      width: 100%;
      padding: 12px;
      margin-top: 4px;
    }

    .consumed .btn-consume { display: none; }

    /* MODALLAR */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 10;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .form-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.8rem; color: var(--text-muted); }
    
    .row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 8px;
    }

    select, input {
      background: #27272a;
      border: 1px solid var(--card-border);
      color: white;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    .item-list-manager {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
    }

    .list-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #27272a;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .btn-del {
      background: none;
      color: #ef4444;
      padding: 2px 6px;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Günün Kutuları</h1>
    <div style="display: flex; gap: 6px;">
      <button class="btn-settings" onclick="openSettingsModal()">⚙️ Kaynaklar</button>
      <button class="btn-reset" onclick="resetAllBoxes()">Sıfırla</button>
      <button class="btn-add" onclick="openModal()">+ Kutu Ekle</button>
    </div>
  </header>

  <!-- KUTU LİSTESİ -->
  <div id="box-list" class="box-container"></div>

  <!-- KUTU EKLEME MODALI -->
  <div id="add-modal" class="modal">
    <div class="modal-content">
      <h2 style="margin:0; font-size:1.1rem;">Yeni Kutu Oluştur</h2>
      
      <div class="form-group">
        <label>Protein Kaynağı</label>
        <div class="row">
          <select id="p-select"></select>
          <input type="text" id="p-amt" value="200g">
        </div>
      </div>

      <div class="form-group">
        <label>Karbonhidrat Kaynağı</label>
        <div class="row">
          <select id="c-select"></select>
          <input type="text" id="c-amt" value="70g">
        </div>
      </div>

      <div class="form-group">
        <label>Yeşil / Zeytinyağlı</label>
        <div class="row">
          <select id="v-select"></select>
          <input type="text" id="v-amt" value="120g">
        </div>
      </div>

      <div style="display:flex; gap:8px; margin-top:8px;">
        <button style="flex:1; background:#3f3f46; color:white;" onclick="closeModal('add-modal')">İptal</button>
        <button style="flex:1;" class="btn-add" onclick="saveNewBox()">Kaydet</button>
      </div>
    </div>
  </div>

  <!-- KAYNAK YÖNETİMİ (AYARLAR) MODALI -->
  <div id="settings-modal" class="modal">
    <div class="modal-content">
      <h2 style="margin:0; font-size:1.1rem;">Besin Kaynaklarını Yönet</h2>
      
      <!-- PROTEIN YÖNETİMİ -->
      <div class="form-group">
        <label style="color:#60a5fa; font-weight:bold;">Proteinler</label>
        <div id="p-list" class="item-list-manager"></div>
        <div style="display:flex; gap:4px;">
          <input type="text" id="new-p" placeholder="Örn: Somon Ğöğsü" style="flex:1;">
          <button class="btn-add" onclick="addSource('proteins', 'new-p')">Ekle</button>
        </div>
      </div>

      <!-- KARB YÖNETİMİ -->
      <div class="form-group">
        <label style="color:#facc15; font-weight:bold;">Karbonhidratlar</label>
        <div id="c-list" class="item-list-manager"></div>
        <div style="display:flex; gap:4px;">
          <input type="text" id="new-c" placeholder="Örn: Tatlı Patates" style="flex:1;">
          <button class="btn-add" onclick="addSource('carbs', 'new-c')">Ekle</button>
        </div>
      </div>

      <!-- SEBZE YÖNETİMİ -->
      <div class="form-group">
        <label style="color:#4ade80; font-weight:bold;">Yeşil / Zeytinyağlılar</label>
        <div id="v-list" class="item-list-manager"></div>
        <div style="display:flex; gap:4px;">
          <input type="text" id="new-v" placeholder="Örn: Sote Ispanak" style="flex:1;">
          <button class="btn-add" onclick="addSource('veggies', 'new-v')">Ekle</button>
        </div>
      </div>

      <button style="background:#3f3f46; color:white; margin-top:10px;" onclick="closeModal('settings-modal')">Kapat</button>
    </div>
  </div>

  <script>
    // Varsayılan Kaynaklar
    const defaultSources = {
      proteins: ["Fırın Tavuk Göğsü", "Yağsız Dana Kıyma/Köfte", "Hindi Göğüs Sote"],
      carbs: ["Basmati Pirinç", "Başbaşı Bulgur", "Fırın Patates"],
      veggies: ["Zeytinyağlı Börülce", "Mevsim Salatası", "Fırın Sebze"]
    };

    let sources = JSON.parse(localStorage.getItem('myMealSources')) || defaultSources;
    let boxes = JSON.parse(localStorage.getItem('myMealBoxes')) || [];

    function saveBoxes() {
      localStorage.setItem('myMealBoxes', JSON.stringify(boxes));
      renderBoxes();
    }

    function saveSources() {
      localStorage.setItem('myMealSources', JSON.stringify(sources));
      updateSelectOptions();
      renderSettingsLists();
    }

    // Select elemanlarını dinamik doldurma
    function updateSelectOptions() {
      const fillSelect = (id, list) => {
        const el = document.getElementById(id);
        el.innerHTML = list.map(item => `<option value="${item}">${item}</option>`).join('');
      };
      fillSelect('p-select', sources.proteins);
      fillSelect('c-select', sources.carbs);
      fillSelect('v-select', sources.veggies);
    }

    // Kaynak Yönetimi Listelerini Basma
    function renderSettingsLists() {
      const renderList = (containerId, type) => {
        const container = document.getElementById(containerId);
        container.innerHTML = sources[type].map((item, index) => `
          <div class="list-item-row">
            <span>${item}</span>
            <button class="btn-del" onclick="deleteSource('${type}', ${index})">✕ Sil</button>
          </div>
        `).join('');
      };
      renderList('p-list', 'proteins');
      renderList('c-list', 'carbs');
      renderList('v-list', 'veggies');
    }

    function addSource(type, inputId) {
      const input = document.getElementById(inputId);
      const val = input.value.trim();
      if (val) {
        sources[type].push(val);
        input.value = '';
        saveSources();
      }
    }

    function deleteSource(type, index) {
      sources[type].splice(index, 1);
      saveSources();
    }

    function renderBoxes() {
      const container = document.getElementById('box-list');
      container.innerHTML = '';

      if (boxes.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:40px 0;">Henüz kutu eklenmedi.<br>"+ Kutu Ekle" butonunu kullanabilirsin.</div>';
        return;
      }

      boxes.forEach((box, index) => {
        const isConsumed = box.consumed;
        container.innerHTML += `
          <div class="box-card ${isConsumed ? 'consumed' : ''}">
            <div class="box-header">
              <span class="box-title">Kutu #${index + 1}</span>
              <span class="box-status">${isConsumed ? 'TÜKETİLDİ (' + box.consumedTime + ')' : 'HAZIR'}</span>
            </div>
            <div class="box-items">
              <div>• ${box.items[0].name} (${box.items[0].amount})</div>
              <div>• ${box.items[1].name} (${box.items[1].amount})</div>
              <div>• ${box.items[2].name} (${box.items[2].amount})</div>
            </div>
            ${!isConsumed ? `<button class="btn-consume" onclick="consumeBox(${index})">Tüket & Shortcuts'a Gönder</button>` : ''}
          </div>
        `;
      });
    }

    function openModal() { updateSelectOptions(); document.getElementById('add-modal').style.display = 'flex'; }
    function openSettingsModal() { renderSettingsLists(); document.getElementById('settings-modal').style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function saveNewBox() {
      const newBox = {
        id: Date.now(),
        consumed: false,
        consumedTime: null,
        items: [
          { name: document.getElementById('p-select').value, amount: document.getElementById('p-amt').value },
          { name: document.getElementById('c-select').value, amount: document.getElementById('c-amt').value },
          { name: document.getElementById('v-select').value, amount: document.getElementById('v-amt').value }
        ]
      };
      boxes.push(newBox);
      saveBoxes();
      closeModal('add-modal');
    }

    function consumeBox(index) {
      boxes[index].consumed = true;
      boxes[index].consumedTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      saveBoxes();

      const payload = encodeURIComponent(JSON.stringify(boxes[index]));
      window.location.href = `shortcuts://run-shortcut?name=MealPrepLogger&input=text&text=${payload}`;
    }

    function resetAllBoxes() {
      if (confirm("Tüm kutuları silip ekranı sıfırlamak istediğine emin misin?")) {
        boxes = [];
        saveBoxes();
      }
    }

    // Başlangıç
    renderBoxes();
  </script>
</body>
</html>
