<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meal Prep Tracker</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --accent: #3b82f6;
      --consumed-bg: #14532d;
      --consumed-border: #22c55e;
      --text: #ffffff;
      --text-muted: #a1a1aa;
      --border: #3f3f46;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    h1, h2 {
      margin: 0;
      font-size: 1.2rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .select-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    select, input {
      background-color: #27272a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }

    .row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 8px;
    }

    button {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:active {
      opacity: 0.8;
    }

    .btn-reset {
      background-color: #7f1d1d;
      margin-top: 10px;
    }

    .consumed-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .consumed-item {
      background-color: var(--consumed-bg);
      border: 1px solid var(--consumed-border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .consumed-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .consumed-title {
      font-weight: bold;
      font-size: 0.95rem;
    }

    .consumed-time {
      font-size: 0.75rem;
      color: #86efac;
    }
  </style>
</head>
<body>

  <!-- ÖĞÜN OLUŞTURUCU -->
  <div class="card">
    <h1>Kutu Hazırla</h1>

    <!-- PROTEİN -->
    <div class="select-group">
      <label>Protein Kaynağı</label>
      <div class="row">
        <select id="protein-name">
          <option value="Fırın Tavuk Göğsü">Fırın Tavuk Göğsü</option>
          <option value="Yağsız Dana Kıyma/Köfte">Yağsız Dana Kıyma/Köfte</option>
          <option value="Hindi Göğüs Sote">Hindi Göğüs Sote</option>
        </select>
        <input type="text" id="protein-amount" value="200g">
      </div>
    </div>

    <!-- KARBONHİDRAT -->
    <div class="select-group">
      <label>Karbonhidrat Kaynağı</label>
      <div class="row">
        <select id="carb-name">
          <option value="Basmati Pirinç">Basmati Pirinç</option>
          <option value="Başbaşı Bulgur">Başbaşı Bulgur</option>
          <option value="Fırın Patates">Fırın Patates</option>
        </select>
        <input type="text" id="carb-amount" value="70g">
      </div>
    </div>

    <!-- YEŞİL / YAN -->
    <div class="select-group">
      <label>Yeşil / Zeytinyağlı</label>
      <div class="row">
        <select id="veg-name">
          <option value="Zeytinyağlı Börülce">Zeytinyağlı Börülce</option>
          <option value="Mevsim Salatası">Mevsim Salatası</option>
          <option value="Fırın Sebze">Fırın Sebze</option>
        </select>
        <input type="text" id="veg-amount" value="120g">
      </div>
    </div>

    <button onclick="logAndSendMeal()">Shortcuts'a Gönder & Kaydet</button>
  </div>

  <!-- TÜKETİLEN KUTULAR -->
  <div class="card">
    <h2>Tüketilen Kutular</h2>
    <div id="consumed-container" class="consumed-list">
      <!-- Burası JS ile dolacak -->
    </div>
    <button class="btn-reset" onclick="resetDay()">Günü Sıfırla</button>
  </div>

  <script>
    // LocalStorage'dan geçmiş kutuları yükle
    let consumedMeals = JSON.parse(localStorage.getItem('consumedMeals') || '[]');

    function renderConsumed() {
      const container = document.getElementById('consumed-container');
      container.innerHTML = '';

      if (consumedMeals.length === 0) {
        container.innerHTML = '<div style="color: var(--text-muted); font-size: 0.9rem;">Henüz tüketilen kutu yok.</div>';
        return;
      }

      consumedMeals.forEach((meal, index) => {
        const itemHtml = `
          <div class="consumed-item">
            <div class="consumed-details">
              <div class="consumed-title">Kutu #${index + 1}</div>
              <div style="font-size: 0.85rem;">
                ${meal.items.map(i => `${i.name} (${i.amount})`).join(' + ')}
              </div>
            </div>
            <div class="consumed-time">${meal.time}</div>
          </div>
        `;
        container.innerHTML += itemHtml;
      });
    }

    function logAndSendMeal() {
      // Form değerlerini topla
      const mealData = {
        items: [
          { name: document.getElementById('protein-name').value, amount: document.getElementById('protein-amount').value },
          { name: document.getElementById('carb-name').value, amount: document.getElementById('carb-amount').value },
          { name: document.getElementById('veg-name').value, amount: document.getElementById('veg-amount').value }
        ],
        timestamp: new Date().toISOString(),
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      // Tüketilenlere ekle ve LocalStorage'a kaydet
      consumedMeals.push(mealData);
      localStorage.setItem('consumedMeals', JSON.stringify(consumedMeals));
      renderConsumed();

      // Shortcuts URL Scheme tetikle
      // Kestirme Adı: MealPrepLogger
      const payload = encodeURIComponent(JSON.stringify(mealData));
      const shortcutURL = `shortcuts://run-shortcut?name=MealPrepLogger&input=text&text=${payload}`;
      
      window.location.href = shortcutURL;
    }

    function resetDay() {
      if (confirm("Bugünün kutularını sıfırlamak istediğine emin misin?")) {
        consumedMeals = [];
        localStorage.removeItem('consumedMeals');
        renderConsumed();
      }
    }

    // İlk açılışta ekrana bas
    renderConsumed();
  </script>
</body>
</html>
